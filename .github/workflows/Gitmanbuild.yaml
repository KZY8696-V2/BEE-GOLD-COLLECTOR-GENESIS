name: BEE GOLD COLLECTOR GENESIS EDITION PROTOTYPE 1.0.0

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build via SGDK v2.11 & Makefile Setup
    runs-on: windows-latest

    steps:
      - name: Checkout Project Repository
        uses: actions/checkout@v4

      - name: Setup Makefile & Verify Source File
        shell: pwsh
        run: |
          Write-Host "=== 1. Kaynak Dosya Kontrolü ve Makefile Hazırlığı ==="
          
          $cFile = Get-ChildItem -Path "src" -Filter "BGCGENESISMAIN.*" | Select-Object -First 1

          if (-not $cFile) {
              Write-Error "Hata: src klasöründe BGCGENESISMAIN dosyası bulunamadı!"
              exit 1
          }

          Write-Host "Bulunan kaynak dosya: $($cFile.Name)"

          $makeContent = "SRC_C = src/$($cFile.Name)`n`ninclude C:/sgdk/Makefile.gen"
          Set-Content -Path "Makefile" -Value $makeContent
          Write-Host "Makefile başarıyla oluşturuldu."

      - name: Clone SGDK v2.11 & Setup Environment
        shell: pwsh
        run: |
          Write-Host "=== 2. SGDK v2.11 Resmi Deposundan İndiriliyor ==="
          git clone --branch v2.11 --depth 1 https://github.com/Stephane-D/SGDK.git C:\sgdk

          [Environment]::SetEnvironmentVariable("GDK", "C:\sgdk", "Process")
          [Environment]::SetEnvironmentVariable("GDK", "C:\sgdk", "Machine")

          $env:Path = "C:\sgdk\bin;" + $env:Path
          [Environment]::SetEnvironmentVariable("Path", $env:Path, "Machine")

      - name: Build ROM using SGDK Bin Executables
        shell: cmd
        run: |
          echo "=== 3. SGDK v2.11 Bin Klasöründen Derleme Başlatılıyor ==="
          set GDK=C:\sgdk
          set PATH=C:\sgdk\bin;%PATH%

          C:\sgdk\bin\make -f C:/sgdk/Makefile.gen clean
          C:\sgdk\bin\make release

      - name: Package Genesis ROM Artifact
        shell: pwsh
        run: |
          Write-Host "=== 4. ROM Dosyası Paketleniyor ==="
          $romFile = Get-ChildItem -Path "out", "." -Include "*.bin", "*.gen" -Recurse | Select-Object -First 1

          if ($romFile) {
            Write-Host "Başarılı! ROM Dosyası Bulundu: $($romFile.FullName)"
            Copy-Item $romFile.FullName ".\BEE_GOLD_GENESIS.bin"
            Compress-Archive -Path "BEE_GOLD_GENESIS.bin" -DestinationPath "Bee_Gold_Collector_v211.zip" -Force
            Write-Host "ZIP Paketi Hazır!"
          } else {
            Write-Error "Hata: ROM dosyası üretilemedi."
            exit 1
          }

      - name: Upload Windows Genesis Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Bee-Gold-Collector-v211-ROM
          if-no-files-found: error
          path: |
            Bee_Gold_Collector_v211.zip
            BEE_GOLD_GENESIS.bin
