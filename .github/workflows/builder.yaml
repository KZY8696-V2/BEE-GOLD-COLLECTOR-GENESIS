name: Build Sega Genesis ROM (Windows SGDK)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build via Bin Directory & Custom C File
    runs-on: windows-latest

    steps:
      - name: Checkout Project Repository
        uses: actions/checkout@v4

      - name: Setup Project Structure & Clone SGDK
        shell: pwsh
        run: |
          Write-Host "=== 1. Proje Yapısı ve Dosya Konumları Ayarlanıyor ==="
          
          # src klasörü yoksa oluştur
          if (!(Test-Path "src")) {
              New-Item -ItemType Directory -Path "src"
          }

          # BGCGENESISMAIN.C (veya küçük/büyük harf varyasyonları) ana dizindeyse src içine taşı
          $foundFile = Get-ChildItem -Path "." -Filter "*BGCGENESISMAIN*" -Recurse | Select-Object -First 1
          if ($foundFile -and $foundFile.DirectoryName -ne "$PWD\src") {
              Copy-Item $foundFile.FullName "src\BGCGENESISMAIN.c" -Force
              Write-Host "Dosya src\BGCGENESISMAIN.c olarak kopyalandı."
          }

          # Özel Makefile oluştur
          $makeContent = "SRC_C = src/BGCGENESISMAIN.c`n`ninclude `$(GDK)/Makefile.gen"
          Set-Content -Path "Makefile" -Value $makeContent
          Write-Host "Özel Makefile oluşturuldu!"

          Write-Host "=== 2. SGDK GitHub Deposundan İndiriliyor ==="
          git clone https://github.com/Stephane-D/SGDK.git C:\sgdk

          [Environment]::SetEnvironmentVariable("GDK", "C:\sgdk", "Process")
          [Environment]::SetEnvironmentVariable("GDK", "C:\sgdk", "Machine")

          $env:Path = "C:\sgdk\bin;" + $env:Path
          [Environment]::SetEnvironmentVariable("Path", $env:Path, "Machine")

      - name: Build ROM using SGDK Bin Executables
        shell: cmd
        run: |
          echo "=== 3. SGDK Bin Klasöründen Derleme Başlatılıyor ==="
          set GDK=C:\sgdk
          set PATH=C:\sgdk\bin;%PATH%

          :: Önceki derleme artıklarını temizle
          C:\sgdk\bin\make -f C:/sgdk/Makefile.gen clean

          :: Projeyi derle
          C:\sgdk\bin\make release

      - name: Package Genesis ROM Artifact
        shell: pwsh
        run: |
          Write-Host "=== 4. ROM Dosyası Paketleniyor ==="
          $romFile = Get-ChildItem -Path "out", "." -Include "*.bin", "*.gen" -Recurse | Select-Object -First 1

          if ($romFile) {
            Write-Host "Başarılı! ROM Dosyası Bulundu: $($romFile.FullName)"
            Copy-Item $romFile.FullName ".\BEE_GOLD_GENESIS.bin"
            Compress-Archive -Path "BEE_GOLD_GENESIS.bin" -DestinationPath "Bee_Gold_Collector_Genesis.zip" -Force
            Write-Host "ZIP Paketi Hazır!"
          } else {
            Write-Error "Hata: ROM dosyası üretilemedi."
            exit 1
          }

      - name: Upload Windows Genesis Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Bee-Gold-Collector-Genesis-Windows-ROM
          if-no-files-found: error
          path: |
            Bee_Gold_Collector_Genesis.zip
            BEE_GOLD_GENESIS.bin
